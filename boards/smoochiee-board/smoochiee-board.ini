; PlatformIO Project Configuration File
; Board: ESP32-S3 + ILI9341 2.4" TFT Touch + All Modules
; Flash: 16MB, PSRAM: 8MB

[env:smoochiee-board]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; Memory & Flash
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.psram_type = opi
board_has_psram = true

; Source Filter
build_src_filter = ${env.build_src_filter} +<../boards/smoochiee-board>

; 🔥 SINGLE BUILD_FLAGS BLOCK - NO += ANYWHERE 🔥
build_flags =
    ${env.build_flags}
    -Iboards/smoochiee-board
    -Os
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_CACHE_WORKAROUND
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_RST=17
    -DTFT_DC=16
    -DTFT_CS=5
    -DTFT_MOSI=21
    -DTFT_MISO=19
    -DTFT_SCLK=18
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DHAS_TOUCH=1
    -DTOUCH_CS=14
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSDCARD_CS=46
    -DSDCARD_SCLK=18
    -DSDCARD_MISO=19
    -DSDCARD_MOSI=21
    -DSD_CARD_ENABLED
    -DUSE_CC1101_VIA_SPI
    -DCC1101_SS_PIN=3
    -DCC1101_GDO0_PIN=6
    -DCC1101_GDO2_PIN=7
    -DCC1101_MOSI_PIN=21
    -DCC1101_SCK_PIN=18
    -DCC1101_MISO_PIN=19
    -DUSE_NRF24_VIA_SPI
    -DNRF24_SS_PIN=10
    -DNRF24_CE_PIN=11
    -DNRF24_MOSI_PIN=21
    -DNRF24_SCK_PIN=18
    -DNRF24_MISO_PIN=19
    -DIR_TX_PINS='{{"M5 IR Mod", 8}, {"Grove W", 9}, {"Grove Y", 8}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
    -DIR_RX_PINS='{{"M5 IR Mod", 9}, {"Grove W", 9}, {"Grove Y", 8}, {"GPIO 4", 4}, {"GPIO 2", 2}}'
    -DRF_TX_PINS='{{"M5 RF433T", 8}, {"Grove W", 9}, {"Grove Y", 8}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
    -DRF_RX_PINS='{{"M5 RF433R", 9}, {"Grove W", 9}, {"Grove Y", 8}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
    -DMIC_INMP441
    -DBUZZ_PIN=44
    -DI2S_CLK=13
    -DI2S_DATA=33
    -DI2S_WS=34
    -DUSE_HSPI_PORT=1
    -DHAS_RGB_LED=1
    -DRGB_LED_PIN=45
    -DLED_TYPE=WS2812B
    -DLED_ORDER=GRB
    -DLED_COUNT=16
    -DXPOWERS_CHIP_BQ25896
    -DUSE_BOOST
    -DGROVE_SDA=8
    -DGROVE_SCL=9
    -DUSE_IO_EXPANDER
    -DIO_EXPANDER_AW9523
    -DDEVICE_NAME='"Smoochiee Board"'
    -DBTN_ALIAS='"TOUCH"'

; Upload & Monitor
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, log2file

; Libraries
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.4.0
    lewisxhe/XPowersLib @ ^0.3.0
    fs/SD @ ^2.0.0
    fs/FFat @ ^2.0.0
    jgromes/RadioLib @ ^6.6.0
    nRF24/RF24 @ ^1.4.8
    fastled/FastLED @ ^3.7.0
    bblanchon/ArduinoJson @ ^6.21.3
