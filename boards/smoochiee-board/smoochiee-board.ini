; PlatformIO Project Configuration File
; Board: ESP32-S3 + ILI9341 2.4" TFT Touch + All Modules
; Flash: 16MB (N16), PSRAM: 8MB (R8)
;
; Build options, upload settings, libraries, and advanced scripting
; Docs: https://docs.platformio.org/page/projectconf.html

[env:smoochiee-board]
; =====================================
; Platform & Board
; =====================================
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1-n16r8
framework = arduino

; =====================================
; Memory & Flash Configuration
; =====================================
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; PSRAM Configuration (8MB Octal PSRAM)
board_build.psram_type = opi
board_has_psram = true
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCONFIG_SPIRAM_CACHE_WORKAROUND

; =====================================
; Source & Include Paths
; =====================================
build_src_filter = ${env.build_src_filter} +<../boards/smoochiee-board>
build_flags +=
    -Iboards/smoochiee-board
    -Os
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; =====================================
; Display Configuration (ILI9341 - PIN TIDAK DIUBAH)
; =====================================
build_flags +=
    ; TFT Driver & Resolution
    -DILI9341_DRIVER
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_RGB
    ;-DTFT_RGB_ORDER=TFT_BGR        ; Uncomment if colors inverted
    ;-DTFT_INVERSION_ON             ; Uncomment if screen needs inversion
    ;-DTFT_INVERSION_OFF

    ; TFT Pin Mapping (SESUAI WIRING AWAL)
    -DTFT_RST=17
    -DTFT_DC=16
    -DTFT_CS=5
    -DTFT_MOSI=21
    -DTFT_MISO=19
    -DTFT_SCLK=18
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH

    ; SPI Settings
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; =====================================
; Touch Screen Configuration
; =====================================
build_flags +=
    -DHAS_TOUCH=1
    -DTOUCH_CS=14
    ;-DTOUCH_IRQ=35                 ; Optional, handled implicitly
    -DSPI_TOUCH_FREQUENCY=2500000

; =====================================
; SD Card Configuration
; =====================================
build_flags +=
    -DSDCARD_CS=46
    -DSDCARD_SCLK=18
    -DSDCARD_MISO=19
    -DSDCARD_MOSI=21
    -DSD_CARD_ENABLED

; =====================================
; RF Modules Configuration
; =====================================
; CC1101 (Sub-GHz)
build_flags +=
    -DUSE_CC1101_VIA_SPI
    -DCC1101_SS_PIN=3
    -DCC1101_GDO0_PIN=6
    -DCC1101_GDO2_PIN=7
    -DCC1101_MOSI_PIN=21
    -DCC1101_SCK_PIN=18
    -DCC1101_MISO_PIN=19

; NRF24 (2.4GHz)
build_flags +=
    -DUSE_NRF24_VIA_SPI
    -DNRF24_SS_PIN=10
    -DNRF24_CE_PIN=11
    -DNRF24_MOSI_PIN=21
    -DNRF24_SCK_PIN=18
    -DNRF24_MISO_PIN=19

; =====================================
; IR / RF Generic Pin Lists (UI Selection)
; =====================================
build_flags +=
    -DIR_TX_PINS='{{"M5 IR Mod", 8}, {"Grove W", 9}, {"Grove Y", 8}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
    -DIR_RX_PINS='{{"M5 IR Mod", 9}, {"Grove W", 9}, {"Grove Y", 8}, {"GPIO 4", 4}, {"GPIO 2", 2}}'
    -DRF_TX_PINS='{{"M5 RF433T", 8}, {"Grove W", 9}, {"Grove Y", 8}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
    -DRF_RX_PINS='{{"M5 RF433R", 9}, {"Grove W", 9}, {"Grove Y", 8}, {"GPIO 1", 1}, {"GPIO 2", 2}}'

; =====================================
; Audio & Buzzer
; =====================================
build_flags +=
    -DMIC_INMP441
    -DBUZZ_PIN=44
    -DI2S_CLK=13
    -DI2S_DATA=33
    -DI2S_WS=34
    -DUSE_HSPI_PORT=1

; =====================================
; RGB LED (WS2812B)
; =====================================
build_flags +=
    -DHAS_RGB_LED=1
    -DRGB_LED_PIN=45
    -DLED_TYPE=WS2812B
    -DLED_ORDER=GRB
    -DLED_COUNT=16

; =====================================
; Power Management (PMU BQ25896)
; =====================================
build_flags +=
    -DXPOWERS_CHIP_BQ25896
    -DUSE_BOOST
    -DGROVE_SDA=8
    -DGROVE_SCL=9

; =====================================
; IO Expander (AW9523 via I2C)
; =====================================
build_flags +=
    -DUSE_IO_EXPANDER
    -DIO_EXPANDER_AW9523

; =====================================
; Device Info & UI
; =====================================
build_flags +=
    -DDEVICE_NAME='"Smoochiee Board"'
    -DBTN_ALIAS='"TOUCH"'
    ;-DHAS_5_BUTTONS                  ; Commented: touch-only navigation

; =====================================
; Upload & Monitor Settings
; =====================================
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time, log2file

; =====================================
; Library Dependencies
; =====================================
lib_deps =
    ${env.lib_deps}
    
    ; Display & Graphics
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.4.0
    
    ; Power Management
    lewisxhe/XPowersLib @ ^0.3.0
    
    ; File System & SD
    fs/SD @ ^2.0.0
    fs/FFat @ ^2.0.0
    
    ; RF Modules
    jgromes/RadioLib @ ^6.6.0          ; CC1101 support
    nRF24/RF24 @ ^1.4.8                ; NRF24 support
    
    ; Touch Screen
    bodmer/TFT_Touch_Shim_V2 @ ^1.0.0  ; Optional touch shim
    
    ; RGB LED
    fastled/FastLED @ ^3.7.0
    
    ; Utilities
    bblanchon/ArduinoJson @ ^6.21.3
